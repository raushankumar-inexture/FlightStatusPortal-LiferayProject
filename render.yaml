services:
  - type: web
    name: flight-status-portal
    runtime: docker
    plan: pro
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: ./deploy/render
    disk:
      name: liferay-data
      mountPath: /opt/liferay/data
      sizeGB: 10
    envVars:
      - key: PORT
        value: "8080"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: TWILIO_EMAIL_FROM_ADDRESS
        sync: false
      - key: TWILIO_EMAIL_FROM_NAME
        value: Flight Status Alerts
